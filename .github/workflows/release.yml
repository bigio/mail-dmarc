name: Release

on:
  release:
    types: [published]

permissions:
  contents: write
  packages: write

jobs:
  test:
    runs-on: ubuntu-24

    steps:
      - uses: actions/checkout@v6

      - name: Install deps
        run: |
          perl Makefile.PL
          cpanm -n .

  release:
    needs: [test]
    runs-on: ubuntu-24
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-tags: true

      - name: Setup Perl
        uses: shogo82148/actions-setup-perl@v1
        with:
          perl-version: '5.40'

      - name: Bump version
        run: |
          chmod +x .release/version_increment.sh
          .release/version_increment.sh

      - name: Commit and tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -u
          git commit -m "release v${{ inputs.version }}"
          git tag "v${{ inputs.version }}"
          git push origin HEAD --tags

      - name: Build distributions
        run: perl Makefile.PL && make dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          name: NicTool v${{ inputs.version }}
          generate_release_notes: true
          files: |
            Mail-DMARC-*.tar.gz

